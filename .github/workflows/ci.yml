name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['24.22.3', '26.13.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == '26.13.1'
        run: npm run smoke:pilot:postgres
      - if: matrix.node == '26.13.1'
        run: |
          npm audit --audit-level=low
          npm audit --prefix experiments/stack --audit-level=low
          npm audit --prefix experiments/reliability --audit-level=low
